<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chainboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>chainboard <small id="ver"></small></h1>
  <div id="status" class="muted">연결 중…</div>
</header>
<main>
  <section id="side">
    <div class="card">
      <h2>지갑</h2>
      <div id="wallet" class="mono small"></div>
      <details><summary>예치 · 송금</summary>
        <form id="stakeForm"><input name="amount" placeholder="코인 수량" required>
          <button data-op="stake">예치</button><button data-op="unstake">예치 해제</button></form>
        <form id="sendForm"><input name="to" placeholder="cb1… 주소" required><input name="amount" placeholder="코인 수량" required>
          <button>송금</button></form>
      </details>
    </div>
    <div class="card">
      <h2>게시판</h2>
      <ul id="boards"></ul>
      <form id="boardForm"><input name="name" placeholder="게시판 이름" maxlength="32" required><button>열기</button></form>
    </div>
    <div class="card">
      <h2>채굴</h2>
      <div id="mining" class="small"></div>
    </div>
  </section>
  <section id="content">
    <div class="card" id="composeCard">
      <h2 id="boardTitle">게시판을 고르세요</h2>
      <label class="small"><input type="checkbox" id="bestOnly"> 개념글만 (좋아요 <input id="minLikes" type="number" value="3" min="1" style="width:4em">개 이상)</label>
      <form id="postForm">
        <textarea name="text" maxlength="1000" placeholder="글 내용 (100자 안팎 권장)"></textarea>
        <div class="row">
          <input type="file" name="file" accept="image/png,image/jpeg,image/gif">
          <select name="tier" title="첨부 보존 기간">
            <option value="1m">첨부 1개월</option><option value="1y" selected>첨부 1년</option>
            <option value="5y">첨부 5년</option><option value="20y">첨부 20년</option><option value="perm">첨부 영구</option>
          </select>
          <select name="lane" title="차선">
            <option value="free">무료 차선 (예치 할당)</option><option value="fee">수수료 차선</option>
          </select>
          <button>글쓰기</button>
        </div>
        <p class="small muted">보낸 글은 0~5분 무작위 지연 후 다른 노드를 거쳐 나갑니다(발신 위치 보호). 첨부 이미지는 다시 인코딩되어 메타데이터가 지워집니다.</p>
      </form>
    </div>
    <div id="thread"></div>
    <div id="posts"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
